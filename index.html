<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>波兰梅花 叫牌查询</title>
<style>
:root {
  --bg: #0f1419;
  --surface: #1a2332;
  --surface2: #232d3f;
  --border: #2d3f5a;
  --text: #e8edf4;
  --muted: #7a8fa6;
  --accent: #3b82f6;
  --club: #22c55e;
  --diamond: #eab308;
  --heart: #ef4444;
  --spade: #94a3b8;
  --nt: #c084fc;
  --gold: #f59e0b;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}
.header {
  background: linear-gradient(135deg, #1a2d47, #0f1419);
  border-bottom: 1px solid var(--border);
  padding: 10px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 10;
}
.header h1 { font-size: 0.95rem; font-weight: 700; }
.header h1 span { color: var(--club); }
.header-badge { font-size: 0.62rem; background: var(--surface2); border: 1px solid var(--border); border-radius: 20px; padding: 2px 9px; color: var(--muted); }

/* ─── MAIN ─── */
.layout {
  display: grid;
  grid-template-columns: 210px 1fr;
  height: calc(100vh - 45px);
}

/* ─── LEFT PANEL ─── */
.panel-left {
  border-right: 1px solid var(--border);
  overflow-y: auto;
  padding: 10px 9px;
  background: var(--bg);
}
.panel-left::-webkit-scrollbar { width: 4px; }
.panel-left::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.level-label {
  font-size: 0.6rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--muted);
  margin: 8px 0 4px 2px;
}
.level-label:first-child { margin-top: 0; }

.bid-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 4px;
}
.bid-btn {
  aspect-ratio: 1.3;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--surface2);
  color: var(--text);
  font-size: 0.78rem;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.1s;
  min-height: 36px;
  line-height: 1;
}
.bid-btn:hover { border-color: var(--accent); background: rgba(59,130,246,0.12); transform: translateY(-1px); }
.bid-btn:active { transform: translateY(0); }
.bid-btn.club { color: var(--club); }
.bid-btn.diamond { color: var(--diamond); }
.bid-btn.heart { color: var(--heart); }
.bid-btn.spade { color: var(--spade); }
.bid-btn.nt { color: var(--nt); font-size: 0.68rem; }

.action-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 5px;
  margin-top: 10px;
}
.action-btn {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 7px 6px;
  color: var(--muted);
  font-size: 0.7rem;
  font-weight: 600;
  cursor: pointer;
  text-align: center;
  transition: all 0.1s;
}
.action-btn:hover { border-color: var(--accent); color: var(--text); }

/* ─── RIGHT PANEL ─── */
.panel-right {
  overflow-y: auto;
  padding: 10px 14px;
  background: var(--surface);
}
.panel-right::-webkit-scrollbar { width: 4px; }
.panel-right::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

/* Sequence bar */
.seq-bar {
  display: flex;
  align-items: center;
  gap: 3px;
  flex-wrap: wrap;
  min-height: 42px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 7px 11px;
  margin-bottom: 10px;
}
.seq-bid {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 7px;
  padding: 3px 8px;
  font-size: 0.88rem;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.1s;
}
.seq-bid:hover { border-color: var(--accent); }
.seq-bid.opener { border-color: var(--gold); color: var(--gold); background: rgba(245,158,11,0.07); }
.seq-bid.responder { border-color: var(--club); color: var(--club); background: rgba(34,197,94,0.07); }
.seq-sep { color: var(--muted); font-size: 0.72rem; }
.seq-placeholder { color: var(--muted); font-size: 0.8rem; }
.seq-clear { margin-left: auto; background: none; border: none; color: var(--muted); cursor: pointer; font-size: 0.68rem; padding: 3px 6px; border-radius: 4px; transition: color 0.1s; }
.seq-clear:hover { color: #ef4444; }

/* Current bid info */
.current-bid-card {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 13px;
  margin-bottom: 10px;
  animation: fadeIn 0.12s ease;
}
@keyframes fadeIn { from { opacity: 0; transform: translateY(2px); } to { opacity: 1; } }
.current-bid-card h2 {
  font-size: 0.95rem;
  font-weight: 700;
  margin-bottom: 4px;
  display: flex;
  align-items: center;
  gap: 7px;
}
.current-bid-card h2 .bid-sym { font-size: 1.05rem; }
.current-bid-card h2 .role-badge {
  font-size: 0.62rem;
  font-weight: 600;
  background: var(--accent);
  color: white;
  border-radius: 4px;
  padding: 1px 6px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.current-bid-card h2 .role-badge.resp { background: var(--club); }
.current-bid-card p { font-size: 0.8rem; color: var(--muted); line-height: 1.45; }
.tags { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px; }
.tag { display: inline-block; padding: 1px 6px; border-radius: 4px; font-size: 0.62rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
.tag-forcing { background: rgba(239,68,68,0.18); color: #fca5a5; }
.tag-natural { background: rgba(34,197,94,0.15); color: #86efac; }
.tag-artificial { background: rgba(168,85,247,0.18); color: #d8b4fe; }
.tag-game { background: rgba(59,130,246,0.18); color: #93c5fd; }
.tag-weak { background: rgba(100,116,139,0.2); color: #94a3b8; }
.tag-invitational { background: rgba(245,158,11,0.18); color: #fcd34d; }

/* Next bids section */
.next-title {
  font-size: 0.62rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--gold);
  margin-bottom: 6px;
}
.next-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 6px;
}
.next-item {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 9px 11px;
  cursor: pointer;
  transition: all 0.1s;
}
.next-item:hover {
  border-color: var(--accent);
  background: rgba(59,130,246,0.1);
  transform: translateY(-1px);
}
.next-item:active { transform: translateY(0); }
.next-bid { font-size: 0.95rem; font-weight: 700; margin-bottom: 2px; }
.next-bid.club { color: var(--club); }
.next-bid.diamond { color: var(--diamond); }
.next-bid.heart { color: var(--heart); }
.next-bid.spade { color: var(--spade); }
.next-bid.nt { color: var(--nt); }
.next-desc { font-size: 0.75rem; color: var(--muted); line-height: 1.4; }

/* Empty state */
.empty-state { text-align: center; padding: 40px 20px; color: var(--muted); }
.empty-state .icon { font-size: 2rem; opacity: 0.25; margin-bottom: 10px; }
.empty-state p { font-size: 0.85rem; }

/* Hint text */
.hint {
  text-align: center;
  padding: 8px;
  color: var(--muted);
  font-size: 0.75rem;
  background: var(--surface2);
  border: 1px dashed var(--border);
  border-radius: 8px;
  margin-bottom: 10px;
}

/* ─── RESPONSIVE ─── */
@media (max-width: 640px) {
  .layout { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
  .panel-left { border-right: none; border-bottom: 1px solid var(--border); overflow-y: visible; padding: 8px; }
  .panel-right { min-height: 55vh; }
  .next-grid { grid-template-columns: 1fr 1fr; }
}
</style>
</head>
<body>

<div class="header">
  <h1>♣ <span>波兰梅花</span></h1>
  <span class="header-badge">叫牌查询</span>
</div>

<div class="layout">
  <!-- LEFT: bid buttons -->
  <div class="panel-left">
    <div class="level-label">一阶</div>
    <div class="bid-grid" id="grid1"></div>
    <div class="level-label">二阶</div>
    <div class="bid-grid" id="grid2"></div>
    <div class="action-row">
      <button class="action-btn" onclick="undo()">↩ 撤销</button>
      <button class="action-btn" onclick="clearAll()">🗑 清空</button>
    </div>
  </div>

  <!-- RIGHT: sequence + next options -->
  <div class="panel-right">
    <div class="seq-bar" id="seqBar">
      <span class="seq-placeholder">点击左侧叫品开始</span>
    </div>

    <div id="mainContent">
      <div class="hint">← 点击左侧叫品构建序列</div>
    </div>
  </div>
</div>

  "2C-2D": {t:"2♣-2♦",role:"responder",tag:"weak",title:"等待应叫",meaning:"应叫者没有立即回答手段，等待开叫者描述牌情。",next:{}},
  "2C-2H": {t:"2♣-2♥",role:"responder",tag:"natural forcing",title:"4张♥ 7+点",meaning:"4张♥，7+点。",next:{}},
  "2C-2S": {t:"2♣-2♠",role:"responder",tag:"natural forcing",title:"4张♠ 7+点",meaning:"4张♠，7+点。",next:{}},
  "2C-2NT":{t:"2♣-2NT",role:"responder",tag:"natural",title:"均型 0-7点",meaning:"0-7点均型，不知如何应叫时的保守选择。",next:{}},
};

// ─── STATE ──────────────────────────────────────────────────────────────────
let sequence = [];

// ─── INIT ───────────────────────────────────────────────────────────────────
const level1 = ['1C','1D','1H','1S','1NT'];
const level2 = ['2C','2D','2H','2S','2NT'];

function init() {
  renderGrid('grid1', level1);
  renderGrid('grid2', level2);
}
init();

function renderGrid(id, bids) {
  const el = document.getElementById(id);
  el.innerHTML = bids.map(k => {
    const cls = getCls(k);
    const display = k.replace(/C/,'♣').replace(/D/,'♦').replace(/H/,'♥').replace(/S/,'♠');
    return `<button class="bid-btn ${cls}" onclick="add('${k}')">${display}</button>`;
  }).join('');
  if (id === 'grid2') {
    el.innerHTML += `<button class="bid-btn nt" onclick="add('P')">Pass</button>`;
  }
}

function getCls(k) {
  const s = k.match(/[CDHSNT]$/)?.[0];
  return {C:'club',D:'diamond',H:'heart',S:'spade',NT:'nt'}[s] || 'nt';
}

function fmt(k) {
  return k.replace(/C/g,'♣').replace(/D/g,'♦').replace(/H/g,'♥').replace(/S/g,'♠');
}

function tagHtml(tags) {
  return tags.split(' ').map(t => `<span class="tag tag-${t}">${t}</span>`).join('');
}

// ─── CORE ───────────────────────────────────────────────────────────────────
function add(key) {
  const role = sequence.length % 2 === 0 ? 'opener' : 'responder';
  sequence.push({key, role});
  render();
}

function undo() {
  sequence.pop();
  render();
}

function clearAll() {
  sequence = [];
  render();
}

// ─── RENDER ─────────────────────────────────────────────────────────────────
function render() {
  renderSeq();
  renderMain();
}

function renderSeq() {
  const bar = document.getElementById('seqBar');
  if (sequence.length === 0) {
    bar.innerHTML = '<span class="seq-placeholder">点击左侧叫品开始</span>';
    return;
  }
  bar.innerHTML = sequence.map((s, i) => {
    const rc = s.role === 'opener' ? 'opener' : 'responder';
    const sep = i < sequence.length - 1 ? '<span class="seq-sep">—</span>' : '';
    return `<span class="seq-bid ${rc}" onclick="showAt(${i})">${fmt(s.key)}</span>${sep}`;
  }).join('') + `<button class="seq-clear" onclick="clearAll()">✕</button>`;
}

function renderMain() {
  const main = document.getElementById('mainContent');

  if (sequence.length === 0) {
    main.innerHTML = `<div class="hint">← 点击左侧叫品开始</div>`;
    return;
  }

  const last = sequence[sequence.length - 1];
  const ctx = sequence.length >= 2 ? `${sequence[sequence.length-2].key}-${last.key}` : null;
  const d = (ctx && data[ctx]) ? data[ctx] : (data[last.key] || null);

  // ── Current bid card ──
  let card = '';
  if (d) {
    card = `<div class="current-bid-card">
      <h2>
        <span class="bid-sym ${getCls(last.key)}">${fmt(last.key)}</span>
        <span>${d.title || ''}</span>
        <span class="role-badge ${last.role === 'responder' ? 'resp' : ''}">${last.role === 'opener' ? '开叫' : '应叫'}</span>
      </h2>
      <p>${d.meaning || ''}</p>
      ${d.tag ? `<div class="tags">${tagHtml(d.tag)}</div>` : ''}
    </div>`;
  } else {
    card = `<div class="current-bid-card">
      <h2><span class="bid-sym ${getCls(last.key)}">${fmt(last.key)}</span><span>${last.role === 'opener' ? '开叫' : '应叫'}</span></h2>
    </div>`;
  }

  // ── Next options ──
  // Priority: contextual next > opener's next
  let nextOptions = {};
  if (d && d.next && Object.keys(d.next).length > 0) {
    nextOptions = d.next;
  } else if (ctx && data[ctx] && data[ctx].next) {
    nextOptions = data[ctx].next;
  } else if (data[last.key] && data[last.key].next) {
    nextOptions = data[last.key].next;
  }

  let nextHtml = '';
  if (Object.keys(nextOptions).length > 0) {
    const nextItems = Object.entries(nextOptions).map(([k, v]) => {
      const cls = getCls(k);
      return `<div class="next-item" onclick="add('${k}')">
        <div class="next-bid ${cls}">${fmt(k)}</div>
        <div class="next-desc">${v}</div>
      </div>`;
    }).join('');
    nextHtml = `
      <div class="next-title">可选叫品 · 点击继续</div>
      <div class="next-grid">${nextItems}</div>
      <div style="text-align:center;margin-top:8px;">
        <button class="bid-btn nt" onclick="add('P')" style="font-size:0.78rem;aspect-ratio:auto;padding:6px 16px;">Pass 不叫</button>
      </div>`;
  } else {
    nextHtml = `<div class="hint" style="margin-top:8px;">无预设后续叫品，可手动继续叫牌或点击序列中的叫品查看</div>`;
  }

  main.innerHTML = card + nextHtml;
}

// Click on sequence bid to show its info + next options at that point
function showAt(idx) {
  // Truncate sequence to this point
  const main = document.getElementById('mainContent');
  const saved = sequence.slice(idx + 1);
  sequence = sequence.slice(0, idx + 1);

  renderMain();
  renderSeq();

  // Restore
  sequence = sequence.concat(saved);
}
</script>
</body>
</html>
