<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>波兰梅花 叫牌查询</title>
<style>
:root {
  --bg: #0f1419;
  --surface: #1a2332;
  --surface2: #243044;
  --border: #2d3f5a;
  --text: #e8edf4;
  --muted: #8899aa;
  --accent: #3b82f6;
  --club: #16a34a;
  --diamond: #eab308;
  --heart: #ef4444;
  --spade: #64748b;
  --nt: #a855f7;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Segoe UI', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}
.header {
  background: linear-gradient(135deg, #1e3a5f, #0f1419);
  border-bottom: 1px solid var(--border);
  padding: 14px 20px;
  text-align: center;
}
.header h1 { font-size: 1.1rem; font-weight: 700; }
.header h1 span { color: var(--club); }
.header p { font-size: 0.75rem; color: var(--muted); margin-top: 4px; }

.layout {
  display: grid;
  grid-template-columns: 220px 1fr;
  gap: 0;
  height: calc(100vh - 57px);
}

/* LEFT: Bid buttons */
.panel-left {
  border-right: 1px solid var(--border);
  overflow-y: auto;
  padding: 12px;
}
.section-title {
  font-size: 0.65rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--muted);
  margin: 10px 0 6px;
}
.bid-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 4px;
}
.bid-btn {
  aspect-ratio: 1;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--surface2);
  color: var(--text);
  font-size: 0.9rem;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.12s;
  min-height: 44px;
}
.bid-btn:hover { border-color: var(--accent); background: var(--surface); }
.bid-btn.club { color: var(--club); }
.bid-btn.diamond { color: var(--diamond); }
.bid-btn.heart { color: var(--heart); }
.bid-btn.spade { color: var(--spade); }
.bid-btn.nt { color: var(--nt); }
.bid-btn.wide { aspect-ratio: auto; font-size: 0.75rem; grid-column: span 2; }
.bid-btn.clear-btn { font-size: 0.7rem; font-weight: 400; }

.response-list {
  margin-top: 8px;
}
.response-item {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 10px;
  margin-bottom: 4px;
  cursor: pointer;
  transition: all 0.12s;
}
.response-item:hover { border-color: var(--accent); background: var(--surface); }
.resp-bid { font-size: 1rem; font-weight: 700; margin-bottom: 2px; }
.resp-label { font-size: 0.75rem; color: var(--muted); }

/* RIGHT: Sequence + Info */
.panel-right {
  overflow-y: auto;
  padding: 16px 20px;
}
.seq-bar {
  display: flex;
  align-items: center;
  gap: 4px;
  flex-wrap: wrap;
  min-height: 48px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 14px;
  margin-bottom: 16px;
}
.seq-bid {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 5px 10px;
  font-size: 0.95rem;
  font-weight: 700;
  cursor: pointer;
}
.seq-bid.opener { border-color: #f59e0b; color: #fcd34d; }
.seq-bid.responder { border-color: var(--club); color: #4ade80; }
.seq-bid:hover { border-color: var(--accent); }
.seq-sep { color: var(--muted); font-size: 0.8rem; }
.seq-placeholder { color: var(--muted); font-size: 0.85rem; }

.info-card {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 16px;
  animation: fadeIn 0.15s ease;
}
@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; } }
.info-card h2 { font-size: 1rem; font-weight: 700; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
.info-card h2 .badge { background: var(--accent); color: white; border-radius: 5px; padding: 1px 7px; font-size: 0.8rem; }
.info-card p { font-size: 0.88rem; color: var(--text); line-height: 1.6; margin-bottom: 6px; }
.info-card .note { background: rgba(0,0,0,0.2); border-left: 3px solid #f59e0b; padding: 8px 12px; border-radius: 0 6px 6px 0; font-size: 0.82rem; color: var(--muted); margin: 8px 0; }
.tag {
  display: inline-block; padding: 1px 6px; border-radius: 4px; font-size: 0.7rem; font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.04em;
}
.tag-forcing { background: rgba(239,68,68,0.2); color: #fca5a5; }
.tag-natural { background: rgba(34,197,94,0.2); color: #86efac; }
.tag-artificial { background: rgba(168,85,247,0.2); color: #d8b4fe; }
.tag-game { background: rgba(59,130,246,0.2); color: #93c5fd; }
.tag-weak { background: rgba(107,114,128,0.2); color: #9ca3af; }
.tag-invitational { background: rgba(245,158,11,0.2); color: #fcd34d; }

.empty-state { text-align: center; padding: 40px; color: var(--muted); }
.empty-state .icon { font-size: 2rem; opacity: 0.3; margin-bottom: 10px; }
.empty-state p { font-size: 0.88rem; }
</style>
</head>
<body>

<div class="header">
  <h1>♣ <span>波兰梅花</span> 叫牌查询</h1>
  <p>点击叫品构建序列 · 再次点击查看含义</p>
</div>

<div class="layout">
  <!-- LEFT -->
  <div class="panel-left" id="leftPanel">
    <div class="section-title">点击开叫</div>
    <div class="bid-grid" id="openingGrid"></div>

    <div class="response-list" id="responseList">
      <div class="section-title">应叫（选开叫后出现）</div>
    </div>

    <div style="margin-top:12px;">
      <div class="section-title">操作</div>
      <button class="bid-btn wide clear-btn" onclick="clearAll()" style="width:100%;aspect-ratio:auto;padding:10px;">🗑 清空</button>
    </div>
  </div>

  <!-- RIGHT -->
  <div class="panel-right" id="rightPanel">
    <div class="seq-bar" id="seqBar">
      <span class="seq-placeholder">点击左侧叫品开始</span>
    </div>
    <div id="infoArea">
      <div class="empty-state">
        <div class="icon">♣</div>
        <p>选择叫品，构建叫牌序列</p>
      </div>
    </div>
  </div>
</div>

<script>
// ===== DATA =====
const bids = {
  "1C":  {title:"1♣ 开叫（人工逼叫）",tags:["artificial","forcing"],meaning:"人工预备性开叫，逼叫一轮。好的12点到差的15点均型，或12-18点三色套，或16-18点6张♣套，或19+点强牌。",next:{"1D":"示弱应叫 0-6点","1H":"4张♥ 7+点","1S":"4张♠ 7+点","1NT":"均型 7-10点","2D":"5张+♦ 10+点","2H":"好5张/6张+♥ 进局逼","2S":"好5张/6张+♠ 进局逼","2NT":"均型 11-12点 邀叫","3NT":"13-15点 均型"}},
  "1D":  {title:"1♦ 开叫（自然）",tags:["natural"],meaning:"自然开叫，至少4张♦，12-21点。或4-4-1-4单张♦。",next:{"1H":"4张♥ 7+点","1S":"4张♠ 7+点","1NT":"无4张高花 7-10点","2C":"5张+♣ 10+点","2D":"4张支持 6-10点","2H":"好5张/6张+♥ 进局逼","2S":"好5张/6张+♠ 进局逼","2NT":"11-12点 均型"}},
  "1H":  {title:"1♥ 开叫（自然）",tags:["natural"],meaning:"自然开叫，至少5张♥，12-21点。",next:{"1S":"4张♠ 7+点","1NT":"无4张♠ 7-10点","2C":"5张+♣ 10+点","2D":"5张+♦ 10+点","2H":"4张支持 6-10点","2S":"好5张+♠ 进局逼","2NT":"11-12点","3H":"好13-15点 4张支持"}},
  "1S":  {title:"1♠ 开叫（自然）",tags:["natural"],meaning:"自然开叫，至少5张♠，或4张♠+4张♥双高套，12-21点。",next:{"1NT":"无4张♠ 7-10点","2C":"5张+♣ 10+点","2D":"5张+♦ 10+点","2H":"4张♥ 10+点 询双高","2S":"4张支持 6-10点","2NT":"11-12点","3S":"好13-15点 4张支持"}},
  "1NT": {title:"1NT 开叫（强无将）",tags:["natural","game"],meaning:"强无将，好的12点到坏的15点均型，无4张高花。",next:{"2C":"斯台曼 问高花","2D":"转移叫→♥","2H":"5张♠转移","2S":"5张♠自然","2NT":"邀叫 11-12点","3NT":"封3NT"}},
  "2C":  {title:"2♣ 开叫（强牌）",tags:["artificial","game","forcing"],meaning:"强牌开叫，22+点均型，或19+点非均型（埃坷式强二）。逼叫进局。",next:{"2D":"等待应叫","2H":"4张♥ 7+点","2S":"4张♠ 7+点","2NT":"均型 0-7点","3C":"5张+♣","3D":"5张+♦"}},
  "2D":  {title:"2♦（威尔柯茨2♦）",tags:["weak","natural"],meaning:"弱二开叫，6张以上低花套，或5张低花+4张高花，6-11点。",next:{"2H":"斯台曼 问高花","2S":"4张♠","2NT":"等待","3D":"加叫进局"}},
  "2H":  {title:"2♥ 弱二开叫",tags:["weak","natural"],meaning:"弱二开叫，6张以上♥套，6-11点。",next:{"2S":"斯台曼","2NT":"询问","3H":"加叫 3张支持","4H":"封局"}},
  "2S":  {title:"2♠ 弱二开叫",tags:["weak","natural"],meaning:"弱二开叫，6张以上♠套，6-11点。",next:{"2NT":"询问","3S":"加叫","4S":"封局"}},
  "2NT": {title:"2NT 开叫（双低花）",tags:["weak","natural"],meaning:"双低花5-5或更长，6-11点，阻击性开叫。",next:{"3C":"♣套","3D":"♦套","3H":"止叫","3S":"止叫","3NT":"封3NT"}},
  "P":   {title:"Pass",tags:["natural"],meaning:"不叫。",next:{}},
};

// Contextual responses
const responses = {
  "1C-1D": {title:"1♣-1♦ 示弱应叫",tags:["weak","forcing"],meaning:"应叫者0-6点。开叫者必须继续描述牌情。",next:{"1H":"4张♥或4-4-1-4三色","1S":"4张♠或4-4-1-4三色","1NT":"均型 12-15点 4-2-3-4","2D":"6张+♦ 16-18点","2NT":"18-22点 均型","2C":"人工进局逼 22+"}},
  "1C-1H": {title:"1♣-1♥ 积极应叫",tags:["natural","forcing"],meaning:"应叫者7+点，至少4张♥，逼叫一轮。",next:{"1NT":"无将特征","1S":"4张♠","2H":"4张支持","2S":"6张+强套","2NT":"22-23点 均型","3H":"9赢墩"}},
  "1C-1S": {title:"1♣-1♠ 积极应叫",tags:["natural","forcing"],meaning:"应叫者7+点，至少4张♠，逼叫一轮。",next:{"1NT":"无将特征","2S":"4张支持","2C":"4张♣","2NT":"22-23点 均型","3S":"9赢墩"}},
  "1C-1NT":{title:"1♣-1NT 应叫",tags:["natural"],meaning:"应叫者7-10点均型，无4张高花，不逼叫。",next:{"2C":"4张♣弱牌","2D":"6张+♦ 16-18点","2H":"4张♥","2S":"4张♠","2NT":"18-22点 均型"}},
  "1C-2D": {title:"1♣-2♦ 5张+♦",tags:["natural","forcing"],meaning:"应叫者10+点，5张以上♦套，无4张高花，逼叫一轮。",next:{"2H":"4张♥","2S":"4张♠","2NT":"18-22均型","3D":"6张+好♦ 16-18点","3NT":"赌博式7张♦套"}},
  "1C-2H": {title:"1♣-2♥ 好5张/6张+♥",tags:["natural","game","forcing"],meaning:"好5张或6张以上♥套，进局逼叫。",next:{}},
  "1C-2S": {title:"1♣-2♠ 好5张/6张+♠",tags:["natural","game","forcing"],meaning:"好5张或6张以上♠套，进局逼叫。",next:{}},
  "1C-2NT":{title:"1♣-2NT 均型11-12点",tags:["natural","invitational"],meaning:"应叫者11-12点均型，无4张高花，邀叫进局。",next:{}},
  "1C-3NT":{title:"1♣-3NT 均型13-15点",tags:["game"],meaning:"应叫者13-15点均型，封3NT。",next:{}},
};

// All opening bids
const openings = ["1C","1D","1H","1S","1NT","2C","2D","2H","2S","2NT"];

let sequence = [];

// ===== INIT =====
function init() {
  renderOpeningGrid();
}
init();

function renderOpeningGrid() {
  const grid = document.getElementById('openingGrid');
  grid.innerHTML = openings.map(k => {
    const cls = getBidClass(k);
    return `<button class="bid-btn ${cls}" onclick="addBid('${k}')">${k.replace('C','♣').replace('D','♦').replace('H','♥').replace('S','♠')}</button>`;
  }).join('');
  grid.innerHTML += `<button class="bid-btn nt" onclick="addBid('P')" style="grid-column:span 2;">Pass</button>
    <button class="bid-btn" onclick="undo()" style="grid-column:span 2;font-size:0.7rem;font-weight:400;" title="撤销上一步">↩ 撤销</button>`;
}

function getBidClass(k) {
  if (k === 'P') return 'nt';
  const s = k.match(/[CDHS]$/)?.[0];
  return {C:'club',D:'diamond',H:'heart',S:'spade'}[s] || 'nt';
}

function formatBid(k) {
  return k.replace(/C/g,'♣').replace(/D/g,'♦').replace(/H/g,'♥').replace(/S/g,'♠');
}

// ===== CORE =====
function addBid(key) {
  const isOpener = sequence.length % 2 === 0;
  const role = isOpener ? 'opener' : 'responder';
  sequence.push({ key, role });
  render();
}

function undo() {
  sequence.pop();
  render();
}

function clearAll() {
  sequence = [];
  render();
}

// ===== RENDER =====
function render() {
  renderSeqBar();
  renderLeftPanel();
  renderInfo();
}

function renderSeqBar() {
  const bar = document.getElementById('seqBar');
  if (sequence.length === 0) {
    bar.innerHTML = '<span class="seq-placeholder">点击左侧叫品开始</span>';
    return;
  }
  bar.innerHTML = sequence.map((s, i) => {
    const roleClass = s.role === 'opener' ? 'opener' : 'responder';
    const bidDisplay = formatBid(s.key);
    const sep = i < sequence.length - 1 ? '<span class="seq-sep">—</span>' : '';
    return `<span class="seq-bid ${roleClass}" onclick="showBidAt(${i})">${bidDisplay}</span>${sep}`;
  }).join('') + `<span class="seq-sep" onclick="undo()" style="cursor:pointer;opacity:0.4;font-size:0.75rem;margin-left:4px;" title="撤销">✕</span>`;
}

function renderLeftPanel() {
  // Show responses for the LAST bid in sequence
  const last = sequence[sequence.length - 1];
  const responsesEl = document.getElementById('responseList');

  if (!last) {
    responsesEl.innerHTML = '<div class="section-title">应叫</div><div style="color:var(--muted);font-size:0.78rem;padding:4px 0;">点击开叫后显示应叫</div>';
    return;
  }

  // Build context key
  let ctxKey = null;
  if (sequence.length >= 2) {
    ctxKey = `${sequence[sequence.length-2].key}-${last.key}`;
  }

  // Get response data
  let data = responses[ctxKey] || null;
  let nextOptions = data?.next || last.key === 'P' ? {} : (bids[last.key]?.next || {});

  // If it's a context-specific response, use its next
  if (data && data.next && Object.keys(data.next).length > 0) {
    nextOptions = data.next;
  } else if (ctxKey && bids[ctxKey]) {
    // Fallback to context key bids entry
    const d = bids[ctxKey];
    nextOptions = d?.next || {};
  } else if (!ctxKey && bids[last.key]) {
    nextOptions = bids[last.key].next || {};
  }

  if (sequence.length % 2 === 0 && sequence.length > 0) {
    // Just placed an opener, show responses
    responsesEl.innerHTML = `<div class="section-title">对 ${formatBid(last.key)} 的应叫</div>`;
    if (Object.keys(nextOptions).length === 0) {
      responsesEl.innerHTML += `<div style="color:var(--muted);font-size:0.78rem;padding:4px 0;">无预设应叫数据</div>`;
    } else {
      responsesEl.innerHTML += Object.entries(nextOptions).map(([k, v]) => {
        const cls = getBidClass(k);
        return `<div class="response-item" onclick="addBid('${k}')">
          <div class="resp-bid ${cls}">${formatBid(k)}</div>
          <div class="resp-label">${v}</div>
        </div>`;
      }).join('');
      responsesEl.innerHTML += `<button class="bid-btn nt" onclick="addBid('P')" style="width:100%;aspect-ratio:auto;padding:8px;margin-top:4px;font-size:0.8rem;">Pass</button>`;
    }
  } else {
    // Just placed a response, show next options
    responsesEl.innerHTML = `<div class="section-title">对 ${formatBid(sequence[sequence.length-2]?.key||'')} · ${formatBid(last.key)} 的后续</div>
      <div style="color:var(--muted);font-size:0.78rem;padding:4px 0;">点击下方继续叫牌</div>`;
    const openerKey = sequence[sequence.length-2]?.key;
    const nextNextKey = last.key + '-' + (sequence.length > 2 ? sequence[sequence.length-1].key : '');
    // find next data
    const fullCtx = sequence.length >= 2 ? `${sequence[sequence.length-2].key}-${last.key}` : null;
    const dd = responses[fullCtx];
    const nn = dd?.next || {};
    Object.entries(nn).forEach(([k, v]) => {
      const cls = getBidClass(k);
      responsesEl.innerHTML += `<div class="response-item" onclick="addBid('${k}')">
        <div class="resp-bid ${cls}">${formatBid(k)}</div>
        <div class="resp-label">${v}</div>
      </div>`;
    });
    if (Object.keys(nn).length === 0) {
      // Fallback: use the opener's next (skip response)
      const openerNext = bids[openerKey]?.next || {};
      Object.entries(openerNext).forEach(([k, v]) => {
        const cls = getBidClass(k);
        responsesEl.innerHTML += `<div class="response-item" onclick="addBid('${k}')">
          <div class="resp-bid ${cls}">${formatBid(k)}</div>
          <div class="resp-label">${v}</div>
        </div>`;
      });
    }
  }
}

function renderInfo() {
  const area = document.getElementById('infoArea');
  if (sequence.length === 0) {
    area.innerHTML = `<div class="empty-state"><div class="icon">♣</div><p>选择叫品，构建叫牌序列</p></div>`;
    return;
  }

  const last = sequence[sequence.length - 1];
  let ctxKey = sequence.length >= 2 ? `${sequence[sequence.length-2].key}-${last.key}` : null;
  let d = ctxKey ? (responses[ctxKey] || bids[ctxKey]) : null;
  if (!d) d = bids[last.key] || responses[last.key] || null;

  if (!d) {
    area.innerHTML = `<div class="info-card"><h2>${formatBid(last.key)} <span class="badge">${last.role === 'opener' ? '开叫' : '应叫'}</span></h2></div>`;
    return;
  }

  let html = `<div class="info-card">
    <h2>${formatBid(last.key)} <span class="badge">${d.title.split('（')[0]}</span></h2>`;

  if (d.meaning) {
    html += `<p style="color:#60a5fa;margin-bottom:8px;">${d.meaning}</p>`;
  }
  if (d.tags) {
    html += d.tags.map(t => `<span class="tag tag-${t}">${t}</span>`).join(' ');
  }

  // Show context info if available
  if (ctxKey) {
    const ctx = responses[ctxKey];
    if (ctx && ctx.meaning) {
      html += `<div class="note">${ctx.meaning}</div>`;
    }
  }

  // Show next options
  const nextData = d.next || {};
  const nextCtx = sequence.length >= 2 ? `${sequence[sequence.length-2].key}-${last.key}` : null;
  const finalNext = nextCtx ? (responses[nextCtx]?.next || bids[last.key]?.next || {}) : (bids[last.key]?.next || {});

  if (Object.keys(finalNext).length > 0) {
    html += `<p style="font-size:0.8rem;color:var(--muted);margin-top:10px;border-top:1px solid var(--border);padding-top:10px;">点击下方继续：</p>`;
    html += Object.entries(finalNext).map(([k, v]) => {
      const cls = getBidClass(k);
      return `<div class="response-item" onclick="addBid('${k}')" style="margin-top:4px;">
        <div class="resp-bid ${cls}">${formatBid(k)}</div>
        <div class="resp-label">${v}</div>
      </div>`;
    }).join('');
    html += `<button class="bid-btn nt" onclick="addBid('P')" style="width:100%;aspect-ratio:auto;padding:8px;margin-top:4px;font-size:0.8rem;">Pass</button>`;
  }

  html += '</div>';
  area.innerHTML = html;
}

// Click on seq bid to see its info
function showBidAt(idx) {
  const key = sequence[idx].key;
  let ctxKey = idx >= 1 ? `${sequence[idx-1].key}-${key}` : null;
  let d = ctxKey ? (responses[ctxKey] || bids[ctxKey]) : null;
  if (!d) d = bids[key] || responses[key] || null;
  if (!d) d = { title: key, meaning: '', tags: [] };

  const area = document.getElementById('infoArea');
  let html = `<div class="info-card">
    <h2>${formatBid(key)} <span class="badge">${d.title.split('（')[0]}</span></h2>`;
  if (d.meaning) html += `<p style="color:#60a5fa;margin-bottom:8px;">${d.meaning}</p>`;
  if (d.tags) html += d.tags.map(t => `<span class="tag tag-${t}">${t}</span>`).join(' ');
  html += '</div>';
  area.innerHTML = html;
}
</script>
</body>
</html>
